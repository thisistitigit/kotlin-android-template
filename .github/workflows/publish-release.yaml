name: Build Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.IMPOSTOR_KEYSTORE_BASE64 }}
          IMPOSTOR_STORE_PASSWORD: ${{ secrets.IMPOSTOR_STORE_PASSWORD }}
          IMPOSTOR_KEY_ALIAS: ${{ secrets.IMPOSTOR_KEY_ALIAS }}
          IMPOSTOR_KEY_PASSWORD: ${{ secrets.IMPOSTOR_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$IMPOSTOR_STORE_PASSWORD"
          test -n "$IMPOSTOR_KEY_ALIAS"
          test -n "$IMPOSTOR_KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/impostor.jks"
          echo "IMPOSTOR_KEYSTORE=$RUNNER_TEMP/impostor.jks" >> "$GITHUB_ENV"
      - name: Build signed bundle
        run: ./gradlew :app:bundleRelease :library-data:testDebugUnitTest
        env:
          IMPOSTOR_STORE_PASSWORD: ${{ secrets.IMPOSTOR_STORE_PASSWORD }}
          IMPOSTOR_KEY_ALIAS: ${{ secrets.IMPOSTOR_KEY_ALIAS }}
          IMPOSTOR_KEY_PASSWORD: ${{ secrets.IMPOSTOR_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: impostor-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
